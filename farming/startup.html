<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羌藏耕牧智护 - 创业助手</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#1A6B42', light: '#E8F5EE', dark: '#134E30' },
            secondary: { DEFAULT: '#D4860A', light: '#FFF8EB' },
            accent: { red: '#E74C3C', orange: '#F39C12' }
          },
          fontFamily: { sans: ['Noto Sans SC', '-apple-system', 'sans-serif'] }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="farming-body">

<div class="farming-container">

  <!-- ========== 顶部导航栏（由JS渲染） ========== -->
  <div id="subpage-header"></div>

  <!-- ========== Banner ========== -->
  <div class="mx-4 mt-4 rounded-2xl overflow-hidden" style="background: linear-gradient(135deg, #134E30, #1A6B42, #27AE60);">
    <div class="px-5 py-6 relative">
      <!-- 火箭图标 -->
      <div class="absolute top-4 right-5 w-12 h-12 rounded-full bg-white/15 flex items-center justify-center">
        <i data-lucide="rocket" class="w-6 h-6 text-white"></i>
      </div>
      <h2 class="text-lg font-bold text-white mb-1">返乡创业，AI来助力</h2>
      <p class="text-xs text-white/80 leading-relaxed max-w-[85%]">政策查询、技能培训、成功案例，一站式创业服务</p>
      <button onclick="showToast('创业评估功能演示')" class="mt-4 bg-white text-primary text-sm font-medium px-5 py-2 rounded-full hover:bg-gray-50 transition">
        开始创业评估
      </button>
    </div>
  </div>

  <!-- ========== 功能入口网格 (2x3) ========== -->
  <div class="px-4 mt-5">
    <div class="grid grid-cols-3 gap-3">
      <div onclick="showToast('创业政策库功能演示')" class="bg-white rounded-xl p-4 flex flex-col items-center gap-2 shadow-sm cursor-pointer hover:shadow-md transition">
        <div class="w-10 h-10 rounded-full bg-primary-light flex items-center justify-center">
          <i data-lucide="scroll-text" class="w-5 h-5 text-primary"></i>
        </div>
        <span class="text-xs font-medium text-gray-700">创业政策库</span>
        <span class="text-[10px] text-gray-400 text-center leading-tight">阿坝州最新创业扶持政策</span>
      </div>
      <div onclick="showToast('创业培训功能演示')" class="bg-white rounded-xl p-4 flex flex-col items-center gap-2 shadow-sm cursor-pointer hover:shadow-md transition">
        <div class="w-10 h-10 rounded-full bg-primary-light flex items-center justify-center">
          <i data-lucide="graduation-cap" class="w-5 h-5 text-primary"></i>
        </div>
        <span class="text-xs font-medium text-gray-700">创业培训</span>
        <span class="text-[10px] text-gray-400 text-center leading-tight">线上线下培训课程</span>
      </div>
      <div onclick="showToast('成功案例功能演示')" class="bg-white rounded-xl p-4 flex flex-col items-center gap-2 shadow-sm cursor-pointer hover:shadow-md transition">
        <div class="w-10 h-10 rounded-full bg-primary-light flex items-center justify-center">
          <i data-lucide="award" class="w-5 h-5 text-primary"></i>
        </div>
        <span class="text-xs font-medium text-gray-700">成功案例</span>
        <span class="text-[10px] text-gray-400 text-center leading-tight">优秀返乡创业者案例</span>
      </div>
      <div onclick="showToast('创业社区功能演示')" class="bg-white rounded-xl p-4 flex flex-col items-center gap-2 shadow-sm cursor-pointer hover:shadow-md transition">
        <div class="w-10 h-10 rounded-full bg-primary-light flex items-center justify-center">
          <i data-lucide="users" class="w-5 h-5 text-primary"></i>
        </div>
        <span class="text-xs font-medium text-gray-700">创业社区</span>
        <span class="text-[10px] text-gray-400 text-center leading-tight">创业者交流互动</span>
      </div>
      <div onclick="showToast('融资对接功能演示')" class="bg-white rounded-xl p-4 flex flex-col items-center gap-2 shadow-sm cursor-pointer hover:shadow-md transition">
        <div class="w-10 h-10 rounded-full bg-primary-light flex items-center justify-center">
          <i data-lucide="banknote" class="w-5 h-5 text-primary"></i>
        </div>
        <span class="text-xs font-medium text-gray-700">融资对接</span>
        <span class="text-[10px] text-gray-400 text-center leading-tight">政府/银行补贴政策</span>
      </div>
      <div onclick="showToast('创业评估功能演示')" class="bg-white rounded-xl p-4 flex flex-col items-center gap-2 shadow-sm cursor-pointer hover:shadow-md transition">
        <div class="w-10 h-10 rounded-full bg-primary-light flex items-center justify-center">
          <i data-lucide="clipboard-check" class="w-5 h-5 text-primary"></i>
        </div>
        <span class="text-xs font-medium text-gray-700">创业评估</span>
        <span class="text-[10px] text-gray-400 text-center leading-tight">AI创业可行性分析</span>
      </div>
    </div>
  </div>

  <!-- ========== 推荐政策（横向滚动） ========== -->
  <div class="px-4 mt-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-semibold text-gray-800">推荐政策</h2>
      <button onclick="showToast('查看全部政策')" class="text-xs text-primary">查看全部</button>
    </div>
    <div class="scroll-x flex gap-3 pb-1" id="policies-container">
      <!-- 由JS渲染 -->
    </div>
  </div>

  <!-- ========== 热门培训课程 ========== -->
  <div class="px-4 mt-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-semibold text-gray-800">热门培训课程</h2>
      <button onclick="showToast('查看全部课程')" class="text-xs text-primary">查看全部</button>
    </div>
    <div id="courses-container" class="space-y-3">
      <!-- 由JS渲染 -->
    </div>
  </div>

  <!-- ========== 成功案例（横向滚动） ========== -->
  <div class="px-4 mt-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-semibold text-gray-800">成功案例</h2>
      <button onclick="showToast('查看全部案例')" class="text-xs text-primary">查看全部</button>
    </div>
    <div class="scroll-x flex gap-3 pb-1" id="cases-container">
      <!-- 由JS渲染 -->
    </div>
  </div>

  <!-- ========== 社区动态 ========== -->
  <div class="px-4 mt-5 pb-6">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-semibold text-gray-800">社区动态</h2>
      <button onclick="showToast('进入创业社区')" class="text-xs text-primary">更多</button>
    </div>
    <div class="bg-white rounded-xl shadow-sm overflow-hidden" id="community-container">
      <!-- 由JS渲染 -->
    </div>
  </div>

</div>

<!-- ========== 引用脚本 ========== -->
<script src="../js/mock-data.js"></script>
<script src="../js/components.js"></script>

<script>
  // ========== 渲染顶部导航 ==========
  document.getElementById('subpage-header').innerHTML = renderSubPageHeader('创业助手', 'farm-home.html');

  // ========== 渲染推荐政策 ==========
  function renderPolicies() {
    const container = document.getElementById('policies-container');
    const policies = window.MockData.startup.policies;
    if (!policies || policies.length === 0) {
      container.innerHTML = '<div class="text-xs text-gray-400 py-4 w-full text-center">暂无政策数据</div>';
      return;
    }

    // 政策等级颜色映射
    const levelColors = {
      '省级': { bg: 'bg-blue-100', text: 'text-blue-700' },
      '州级': { bg: 'bg-purple-100', text: 'text-purple-700' },
      '县级': { bg: 'bg-green-100', text: 'text-green-700' }
    };

    container.innerHTML = policies.map(p => {
      const colors = levelColors[p.level] || { bg: 'bg-gray-100', text: 'text-gray-700' };
      return `
        <div class="flex-shrink-0 w-56 bg-white rounded-xl p-3.5 shadow-sm flex flex-col">
          <span class="inline-block self-start text-[10px] px-2 py-0.5 rounded-full ${colors.bg} ${colors.text} font-medium">${p.level}</span>
          <h3 class="text-xs font-medium text-gray-800 mt-2 leading-relaxed line-clamp-2">${p.title}</h3>
          <div class="mt-auto pt-2.5">
            <div class="flex items-center gap-1 text-[10px] text-gray-400 mb-1">
              <i data-lucide="building" class="w-3 h-3"></i>
              <span>${p.source}</span>
            </div>
            <div class="flex items-center gap-1 text-[10px] text-gray-400 mb-2.5">
              <i data-lucide="calendar" class="w-3 h-3"></i>
              <span>截止：${p.deadline}</span>
            </div>
            <button onclick="showToast('查看政策详情')" class="w-full text-xs text-primary bg-primary-light py-1.5 rounded-lg hover:bg-primary hover:text-white transition font-medium">
              查看详情
            </button>
          </div>
        </div>
      `;
    }).join('');

    if (window.lucide) lucide.createIcons();
  }

  // ========== 渲染培训课程 ==========
  function renderCourses() {
    const container = document.getElementById('courses-container');
    const courses = window.MockData.startup.courses;
    if (!courses || courses.length === 0) {
      container.innerHTML = '<div class="text-xs text-gray-400 py-4 text-center">暂无培训课程</div>';
      return;
    }

    // 课程分类渐变色
    const courseGradients = [
      'linear-gradient(135deg, #1A6B42, #27AE60)',
      'linear-gradient(135deg, #2980B9, #3498DB)',
      'linear-gradient(135deg, #8E44AD, #9B59B6)',
      'linear-gradient(135deg, #D4860A, #F39C12)'
    ];

    container.innerHTML = courses.map((course, index) => {
      const progress = Math.min(Math.round((course.enrolled / course.capacity) * 100), 100);
      const gradient = courseGradients[index % courseGradients.length];

      // 状态标签
      let statusBadge = '';
      if (course.status === 'enrolling') {
        statusBadge = '<span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full">报名中</span>';
      } else if (course.status === 'available') {
        statusBadge = '<span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">可学习</span>';
      } else if (course.status === 'upcoming') {
        statusBadge = '<span class="text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full">即将开始</span>';
      } else {
        statusBadge = '<span class="text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">已结束</span>';
      }

      // 课程类型标签
      const typeTag = course.type === '线上培训'
        ? '<span class="text-[10px] bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded">线上</span>'
        : '<span class="text-[10px] bg-amber-50 text-amber-600 px-1.5 py-0.5 rounded">线下</span>';

      return `
        <div class="bg-white rounded-xl shadow-sm overflow-hidden flex" onclick="showToast('课程详情功能演示')">
          <div class="w-20 h-24 flex-shrink-0 flex items-center justify-center" style="background: ${gradient};">
            <i data-lucide="book-open" class="w-6 h-6 text-white/80"></i>
          </div>
          <div class="flex-1 p-3 flex flex-col justify-between min-w-0">
            <div>
              <div class="flex items-center gap-1.5 mb-1">
                <h3 class="text-xs font-medium text-gray-800 truncate">${course.title}</h3>
                ${typeTag}
              </div>
              <div class="flex items-center gap-3 text-[10px] text-gray-400 mb-1.5">
                <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i>${course.date}</span>
                <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i>${course.duration}</span>
              </div>
            </div>
            <div>
              <div class="flex items-center justify-between mb-1">
                <span class="text-[10px] text-gray-500">已报名 ${course.enrolled}/${course.capacity}</span>
                ${statusBadge}
              </div>
              <div class="progress-bar">
                <div class="progress-bar-fill" style="width: ${progress}%; background: ${progress >= 80 ? '#E74C3C' : '#1A6B42'};"></div>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    if (window.lucide) lucide.createIcons();
  }

  // ========== 渲染成功案例 ==========
  function renderSuccessCases() {
    const container = document.getElementById('cases-container');
    const cases = window.MockData.startup.successCases;
    if (!cases || cases.length === 0) {
      container.innerHTML = '<div class="text-xs text-gray-400 py-4 w-full text-center">暂无成功案例</div>';
      return;
    }

    // 案例渐变色
    const caseGradients = [
      'linear-gradient(135deg, #1A6B42, #27AE60)',
      'linear-gradient(135deg, #D4860A, #F39C12)',
      'linear-gradient(135deg, #2980B9, #3498DB)'
    ];

    container.innerHTML = cases.map((c, index) => {
      const gradient = caseGradients[index % caseGradients.length];
      return `
        <div class="flex-shrink-0 w-52 bg-white rounded-xl shadow-sm overflow-hidden">
          <div class="h-20 relative" style="background: ${gradient};">
            <div class="absolute inset-0 flex items-center justify-center">
              <i data-lucide="trophy" class="w-8 h-8 text-white/50"></i>
            </div>
            <div class="absolute bottom-2 left-3">
              <span class="text-white text-xs font-medium">${c.name}</span>
              <span class="text-white/70 text-[10px] ml-1">${c.ethnicity} · ${c.county}</span>
            </div>
          </div>
          <div class="p-3">
            <h3 class="text-xs font-semibold text-gray-800 mb-1 leading-relaxed">${c.project}</h3>
            <p class="text-[10px] text-gray-500 leading-relaxed line-clamp-2 mb-2">${c.summary}</p>
            <div class="flex flex-wrap gap-1">
              ${c.tags.map(tag => `<span class="text-[10px] bg-primary-light text-primary px-1.5 py-0.5 rounded-full">${tag}</span>`).join('')}
            </div>
          </div>
        </div>
      `;
    }).join('');

    if (window.lucide) lucide.createIcons();
  }

  // ========== 渲染社区动态 ==========
  function renderCommunityPosts() {
    const container = document.getElementById('community-container');
    const posts = window.MockData.startup.communityPosts;

    if (!posts || posts.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <i data-lucide="users" class="w-10 h-10 text-gray-300 mb-3"></i>
          <p class="text-xs text-gray-400">暂无社区动态</p>
          <p class="text-[10px] text-gray-300 mt-1">快来成为第一个发帖人吧</p>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
      return;
    }

    container.innerHTML = posts.map(p => {
      const avatarChar = p.author === '匿名用户' ? '匿' : p.author.charAt(0);
      return `
        <div class="flex items-start gap-2.5 px-4 py-3 border-b border-gray-50 last:border-0">
          <div class="w-8 h-8 rounded-full bg-primary-light flex items-center justify-center text-primary text-xs font-medium flex-shrink-0">${avatarChar}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-0.5">
              <span class="text-xs font-medium text-gray-700">${p.author}</span>
              <span class="text-[10px] text-gray-400">${p.time}</span>
            </div>
            <p class="text-xs text-gray-600 leading-relaxed line-clamp-2">${p.content}</p>
          </div>
        </div>
      `;
    }).join('');

    if (window.lucide) lucide.createIcons();
  }

  // ========== 初始化 ==========
  document.addEventListener('DOMContentLoaded', () => {
    renderPolicies();
    renderCourses();
    renderSuccessCases();
    renderCommunityPosts();
    initCommon();
  });
</script>

</body>
</html>
